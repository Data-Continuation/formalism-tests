name: StegClaw Evaluation Handoff

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'formalism_tests/stegclaw_evaluation_handoff.json'
      - 'tools/validate_stegclaw_evaluation_handoff.py'
      - '.github/workflows/stegclaw-evaluation-handoff.yml'
  push:
    paths:
      - 'formalism_tests/stegclaw_evaluation_handoff.json'
      - 'tools/validate_stegclaw_evaluation_handoff.py'
      - '.github/workflows/stegclaw-evaluation-handoff.yml'

permissions:
  contents: read

jobs:
  validate-stegclaw-evaluation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate StegClaw evaluation handoff
        run: python tools/validate_stegclaw_evaluation_handoff.py
      - name: Upload StegClaw evaluation handoff artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stegclaw-evaluation-handoff
          path: reports/stegclaw_evaluation_handoff.json
          if-no-files-found: error
