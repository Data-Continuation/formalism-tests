name: Data Continuation Tests

on:
  workflow_dispatch:
    inputs:
      task_manifest:
        description: "Path to the declared task manifest"
        required: true
        default: "tools/tasks/formalism_tests_tasks.json"
      task_id:
        description: "Optional task_id to run. Leave blank to run all enabled tasks."
        required: false
        default: ""
  push:
    branches:
      - main
    paths-ignore:
      - "declared_task_report.json"
      - "continuation_gate_report.json"
      - "boundary_dynamics_report.json"
      - "reports/**"
      - "legacy/runtime-artifacts/**"
      - "receipts/formalism_proof_package_registry_ci_binding_execution.json"
      - "status/formalism_proof_package_registry_ci_binding.pending.json"
  pull_request:

permissions:
  contents: write
  actions: read
  issues: write

concurrency:
  group: data-continuation-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  continuation-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run declared tasks
        run: |
          set -euo pipefail

          TASK_MANIFEST="${{ github.event.inputs.task_manifest || 'tools/tasks/formalism_tests_tasks.json' }}"
          TASK_ID="${{ github.event.inputs.task_id || '' }}"

          if [ -n "$TASK_ID" ]; then
            python tools/run_declared_tasks.py "$TASK_MANIFEST" --task-id "$TASK_ID"
          else
            python tools/run_declared_tasks.py "$TASK_MANIFEST"
          fi

      - name: Capture Morrison canonical proof on repository-owned main execution
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          python tools/run_morrison_runtime_canonical_ci_capture.py

      - name: Capture optimization-target canonical proof on repository-owned main execution
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          python tools/run_optimization_target_canonical_ci_capture.py

      - name: Validate proof-package registry layer
        run: |
          set -euo pipefail

          python tools/run_declared_tasks.py \
            tools/tasks/formalism_proof_package_registry_tasks.json \
            --task-id check_formalism_proof_package_registry

          python tools/run_declared_tasks.py \
            tools/tasks/formalism_proof_package_registry_ci_binding_tasks.json \
            --task-id check_formalism_proof_package_registry_ci_binding

      - name: Finalize registry CI binding from this workflow run
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          python tools/finalize_formalism_proof_package_registry_ci_binding.py
          python tools/check_formalism_proof_package_registry_ci_binding.py

      - name: Commit artifact routing and CI evidence changes
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain)" ]; then
            echo "No artifact routing or CI evidence changes to commit."
            exit 0
          fi

          git config user.name "StegVerse Bot"
          git config user.email "builder@stegverse.org"

          git add -A

          if git diff --cached --quiet; then
            echo "No staged artifact routing or CI evidence changes to commit."
            exit 0
          fi

          git commit -m "record repository-owned CI binding evidence [skip ci]"
          git push

      - name: Close completed registry CI-binding issue
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          STATUS="$(python - <<'PY'
          import json
          from pathlib import Path
          record = json.loads(Path('status/formalism_proof_package_registry_ci_binding.pending.json').read_text())
          print(record.get('status', ''))
          PY
          )"

          if [ "$STATUS" != "VERIFIED_EXISTING_WORKFLOW_BINDING" ]; then
            echo "Binding is not verified; issue #7 remains open."
            exit 0
          fi

          ISSUE_STATE="$(gh issue view 7 --repo "$GITHUB_REPOSITORY" --json state --jq .state)"
          if [ "$ISSUE_STATE" = "OPEN" ]; then
            gh issue close 7 \
              --repo "$GITHUB_REPOSITORY" \
              --comment "Repository-owned completion succeeded. The existing continuation-tests workflow recorded its run ID, numeric job ID, triggering commit, PASS registry report, report SHA-256, and durable receipt at receipts/formalism_proof_package_registry_ci_binding_execution.json. Authority remains REGISTRY_CONSISTENCY_ONLY and canonical proof issues #3-#6 remain separate."
          else
            echo "Issue #7 is already closed."
          fi

      - name: Close completed Morrison canonical proof issue
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python tools/check_morrison_runtime_canonical_evidence_gate.py
          STATUS="$(python - <<'PY'
          import json
          from pathlib import Path
          record = json.loads(Path('receipts/morrison_runtime_canonical_execution_evidence.json').read_text())
          print(record.get('status', ''))
          PY
          )"
          if [ "$STATUS" != "VERIFIED_CANONICAL_RUN" ]; then
            echo "Morrison canonical evidence not verified; issue #5 remains open."
            exit 1
          fi
          ISSUE_STATE="$(gh issue view 5 --repo "$GITHUB_REPOSITORY" --json state --jq .state)"
          if [ "$ISSUE_STATE" = "OPEN" ]; then
            gh issue close 5 --repo "$GITHUB_REPOSITORY" --comment "Repository-owned canonical Morrison execution completed on this workflow run. The three declared tasks passed, deterministic report/receipt equivalence was retained, the canonical evidence gate passed, and durable evidence is committed by the preceding artifact-routing step. Authority remains EXTERNAL_FRAMEWORK_COMPARATIVE_EVIDENCE_ONLY; downstream promotion remains owned by StegVerse-Labs/admissibility-wiki#39."
          fi

      - name: Close completed optimization-target canonical proof issue
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python tools/check_optimization_target_canonical_evidence_gate.py
          STATUS="$(python - <<'PY'
          import json
          from pathlib import Path
          record = json.loads(Path('receipts/optimization_target_canonical_execution_evidence.json').read_text())
          print(record.get('status', ''))
          PY
          )"
          if [ "$STATUS" != "VERIFIED_CANONICAL_RUN" ]; then
            echo "Optimization-target canonical evidence not verified; issue #6 remains open."
            exit 1
          fi
          ISSUE_STATE="$(gh issue view 6 --repo "$GITHUB_REPOSITORY" --json state --jq .state)"
          if [ "$ISSUE_STATE" = "OPEN" ]; then
            gh issue close 6 --repo "$GITHUB_REPOSITORY" --comment "Repository-owned canonical optimization-target execution completed on this workflow run. The five deterministic cases and all three declared tasks passed, exact report/receipt equivalence was retained, four SHA-256 bindings and four equivalence predicates are durable, and authority remains FORMALISM_TEST_EVIDENCE_ONLY. Downstream wiki/public-route/release gates remain separate."
          fi

      - name: Upload continuation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: data-continuation-theorem-surface
          path: |
            declared_task_report.json
            continuation_gate_report.json
            boundary_dynamics_report.json
            reports/sample_receipts.jsonl
            reports/continuation_report.md
            reports/compound_receipts.jsonl
            reports/compound_continuation_report.md
            reports/formalism_proof_package_registry_verification.json
            reports/formalism_proof_package_registry_ci_binding_verification.json
            receipts/formalism_proof_package_registry_ci_binding_execution.json
            reports/morrison_runtime_commit_time_scope_report.json
            reports/morrison_runtime_commit_time_scope_artifact_verification.json
            reports/morrison_runtime_canonical_evidence_gate.json
            receipts/morrison_runtime_commit_time_scope_execution_receipts.jsonl
            receipts/morrison_runtime_canonical_execution_evidence.json
            MORRISON_RUNTIME_COMMIT_TIME_SCOPE_HANDOFF.md
            reports/optimization_target_commit_boundary_report.json
            reports/optimization_target_commit_boundary_artifact_verification.json
            reports/optimization_target_canonical_evidence_gate.json
            receipts/optimization_target_commit_boundary_execution_receipts.jsonl
            receipts/optimization_target_canonical_execution_evidence.json
            docs/formalisms/OPTIMIZATION_TARGET_COMMIT_BOUNDARY_MIRROR_HANDOFF.md
            reports/stage_32_admissibility_space_report.json
            reports/stage_33_transition_graph_report.json
            reports/stage_34_repair_report.json
            receipts/stage_32_admissibility_space_receipt.jsonl
            receipts/stage_33_transition_graph_receipt.jsonl
            receipts/stage_34_repair_receipt.jsonl
            docs/THEOREM_PROOF_MAP.md
            docs/STAGE_32_TO_34_ADMISSIBILITY_SPACE.md
            legacy/runtime-artifacts/**
          if-no-files-found: warn
