[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "formalism-test-harness"
version = "0.1.0"
description = "Reusable StegVerse/Data-Continuation formalism test harness."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
formalism-harness = "formalism_test_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
